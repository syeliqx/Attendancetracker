<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3557">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--surf:#fff;--ink:#151a23;--mute:#667085;--line:#e4e7ec;--tint:#f1f3f6;--brand:#1d3557;--brandink:#fff;--ok:#2b7a5b;--bad:#b4483f;--sh:0 1px 0 rgba(16,24,40,.04),0 10px 28px -18px rgba(16,24,40,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--surf:#171b23;--ink:#eceff4;--mute:#8b94a5;--line:#262c38;--tint:#1d222c;--brand:#dfe6f3;--brandink:#0f1218;--ok:#6cc3a0;--bad:#ef8f86;--sh:0 1px 0 rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0f1218;--surf:#171b23;--ink:#eceff4;--mute:#8b94a5;--line:#262c38;--tint:#1d222c;--brand:#dfe6f3;--brandink:#0f1218;--ok:#6cc3a0;--bad:#ef8f86;--sh:0 1px 0 rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.7)}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
main{max-width:1100px;margin:0 auto;padding:24px 16px 110px}
.serif,h1,.name,.pct,.big{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:1.9rem;font-weight:600;margin:0;letter-spacing:-.01em}
.tabs{display:inline-flex;background:var(--tint);border-radius:12px;padding:4px;gap:2px}
.tabs button{border:0;background:none;box-shadow:none;border-radius:9px;padding:0 16px;min-height:40px;color:var(--mute);font-weight:600}
.tabs button[aria-current="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:0 14px;min-height:44px}
button:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.primary{background:var(--brand);color:var(--brandink);border-color:var(--brand);font-weight:600}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surf);border-radius:16px;box-shadow:var(--sh);margin-bottom:20px}
.sum{padding:18px 20px;border-left:1px solid var(--line)}.sum:first-child{border-left:0}
.sum small{color:var(--mute)}
.big{font-size:2rem;font-weight:600;line-height:1.15;margin:2px 0 8px}
.bar{position:relative;height:5px;background:var(--line);border-radius:4px}
.fill{height:100%;border-radius:4px}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
#list{display:grid;gap:14px;align-items:start}
.card{background:var(--surf);border-radius:16px;box-shadow:var(--sh)}
.hd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-radius:16px;padding:16px 20px;min-height:76px}
.hm{flex:1;min-width:0}
.name{font-size:1.2rem;font-weight:600;overflow-wrap:anywhere}
.st{font-size:.88rem;color:var(--mute);margin-top:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--mute)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.pct{font-size:1.45rem;font-weight:600}
.chev{color:var(--mute);transition:transform .15s}.chev.open{transform:rotate(90deg)}
.body{padding:0 20px 18px}
.trk{border-top:1px solid var(--line);padding:14px 0 4px}
.th{display:flex;align-items:baseline;gap:10px}
.tn{font-weight:600}.tm{color:var(--mute);font-size:.86rem;flex:1}
.trk .pct{font-size:1.15rem}
.trk .bar{margin:10px 0 10px}
.ts{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tx{font-size:.9rem;font-weight:600}.tx.ok{color:var(--ok)}.tx.bad{color:var(--bad)}.tx.mute{color:var(--mute);font-weight:400}
.qa{display:flex;gap:8px}
.qa button{min-width:92px;font-weight:600}
.qa .p{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.qa .a{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.foot{display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.panel{background:var(--surf);border-radius:16px;box-shadow:var(--sh);padding:16px 20px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input[type=text],.row input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;min-height:46px}
.row input[type=text]{flex:1 1 200px;min-width:0}
.row label{display:flex;gap:8px;align-items:center;color:var(--mute)}
.row input[type=checkbox]{width:20px;height:20px}
.day{display:grid;gap:14px;margin:16px 0}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--tint);border-radius:10px;padding:3px}
.seg button{border:0;box-shadow:none;background:none;min-height:40px;padding:0 14px;color:var(--mute);font-weight:600;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--surf);box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg .sp[aria-pressed="true"]{color:var(--ok)}.seg .sa[aria-pressed="true"]{color:var(--bad)}
.dh{font-weight:600;margin:16px 0 6px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.empty{color:var(--mute);padding:22px 0;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.2s;background:var(--brand);color:var(--brandink);border-radius:12px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.28);max-width:calc(100% - 24px);z-index:5}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;color:inherit;border:1px solid currentColor;min-height:38px}
@media (max-width:560px){.sum{padding:14px 12px}.big{font-size:1.5rem}.dr{flex-direction:column;align-items:stretch}.seg{display:grid;grid-template-columns:repeat(3,1fr)}}
@media (min-width:700px){main{padding:34px 32px 120px}h1{font-size:2.2rem}}
@media (min-width:900px){#list{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Attendance</h1>
  <nav class="tabs" id="tabs"></nav>
  <button id="undo" data-a="undo" disabled>Undo</button>
</header>
<div id="view"></div>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button data-a="undo">Undo</button></div>

<script>
(function(){
var KEY="attendance-tracker-v2",KINDS=[["theory","Theory",75],["practical","Practical",80],["clinical","Clinical",80]];
function uid(){return Math.random().toString(36).slice(2,9)}
function mk(n,c){return{id:uid(),name:n,clin:c,d:{theory:{a:0,t:0},practical:{a:0,t:0},clinical:{a:0,t:0}}}}
var state={subjects:[mk("Ophthalmology",true),mk("ENT",true),mk("Forensic Medicine",false),mk("Community Medicine",false)],log:[]};
var history=[],view="day",draft={},pendDel="",pendReset=false,tt;
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var dayDate=today();
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.subjects)){state=p;state.log=state.log||[];state.subjects.forEach(function(s){if(!s.id)s.id=uid()})}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function snap(){history.push(JSON.stringify(state));if(history.length>50)history.shift()}
function sub(id){return state.subjects.filter(function(s){return s.id===id})[0]}
function kindsFor(s){return KINDS.filter(function(k){return k[0]!=="clinical"||s.clin})}
function kname(k){return KINDS.filter(function(x){return x[0]===k})[0][1]}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fdate(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}catch(e){return iso}}
function status(c,tg){
  var T=tg/100,a=c.a,t=c.t;
  if(!t)return{cls:"mute",txt:"No classes yet"};
  if(a/t>=T){var m=Math.floor(a/T-t+1e-9);return{cls:"ok",txt:m>0?"Can miss "+m+" more":"On the edge, don't miss"}}
  return{cls:"bad",txt:"Attend next "+Math.ceil((T*t-a)/(1-T)-1e-9)+" in a row"}
}
function record(s,k,pr,date){var c=s.d[k];c.t++;if(pr)c.a++;state.log.push({id:uid(),sid:s.id,date:date,k:k,p:pr?1:0})}
function colr(ok){return ok?"var(--ok)":"var(--bad)"}
function render(){
  document.getElementById("tabs").innerHTML=[["day","Log a day"],["subjects","Subjects"],["hist","History"]].map(function(t){return '<button data-a="v" data-v="'+t[0]+'"'+(view===t[0]?' aria-current="true"':'')+'>'+t[1]+'</button>'}).join("");
  document.getElementById("undo").disabled=!history.length;
  var el=document.getElementById("view");
  el.innerHTML=view==="day"?vDay():view==="hist"?vHist():vSubjects();
}
function vSubjects(){
  var h='<div class="sums">'+KINDS.map(function(k){
    var A=0,T=0;state.subjects.forEach(function(s){if(k[0]==="clinical"&&!s.clin)return;A+=s.d[k[0]].a;T+=s.d[k[0]].t});
    var pc=T?A/T*100:null;
    return '<div class="sum"><small>'+k[1]+' overall, min '+k[2]+'%</small><div class="big">'+(pc==null?"0%":pc.toFixed(1)+"%")+'</div><div class="bar"><div class="fill" style="width:'+(pc==null?0:Math.min(100,pc))+'%;background:'+(pc==null?'var(--mute)':colr(pc>=k[2]))+'"></div><div class="mark" style="left:'+k[2]+'%"></div></div></div>';
  }).join("")+'</div><div id="list">';
  h+=state.subjects.map(function(s){
    var ks=kindsFor(s),ps=[],low=[];
    ks.forEach(function(k){var c=s.d[k[0]];if(c.t){var q=c.a/c.t*100;ps.push(q);if(q<k[2])low.push(k[1])}});
    var avg=ps.length?ps.reduce(function(x,y){return x+y},0)/ps.length:null,open=s.open!==false;
    var c='<div class="card"><button class="hd" data-a="o" data-sid="'+s.id+'" aria-expanded="'+open+'"><div class="hm"><div class="name">'+esc(s.name)+'</div><div class="st"><i class="dot '+(avg==null?'':low.length?'bad':'ok')+'"></i>'+(avg==null?"No classes yet":low.length?"Low in "+low.join(", "):"All on track")+'</div></div><div class="pct">'+(avg==null?"0%":avg.toFixed(1)+"%")+'</div><span class="chev'+(open?' open':'')+'">&#9656;</span></button>';
    if(open){
      c+='<div class="body">';
      ks.forEach(function(k){
        var x=s.d[k[0]],pc=x.t?x.a/x.t*100:null,st=status(x,k[2]);
        c+='<div class="trk"><div class="th"><span class="tn">'+k[1]+'</span><span class="tm">'+x.a+' of '+x.t+' classes, min '+k[2]+'%</span><span class="pct">'+(pc==null?"0%":pc.toFixed(1)+"%")+'</span></div>'+
        '<div class="bar"><div class="fill" style="width:'+(pc==null?0:Math.min(100,pc))+'%;background:'+(pc==null?'var(--mute)':colr(pc>=k[2]))+'"></div><div class="mark" style="left:'+k[2]+'%"></div></div>'+
        '<div class="ts"><span class="tx '+st.cls+'">'+st.txt+'</span><div class="qa"><button class="p" data-a="p" data-k="'+k[0]+'" data-sid="'+s.id+'">Present</button><button class="a" data-a="a" data-k="'+k[0]+'" data-sid="'+s.id+'">Absent</button></div></div></div>';
      });
      c+='<div class="foot"><button class="link" data-a="c" data-sid="'+s.id+'">'+(s.clin?"Remove clinical track":"Add clinical track")+'</button><button class="link" data-a="d" data-sid="'+s.id+'">'+(pendDel===s.id?"Tap again to delete":"Delete subject")+'</button></div></div>';
    }
    return c+'</div>';
  }).join("")+'</div>';
  if(!state.subjects.length)h+='<div class="empty">No subjects yet. Add one below.</div>';
  h+='<div class="panel row"><input id="newName" type="text" placeholder="New subject name" maxlength="60" aria-label="Subject name"><label><input id="newClin" type="checkbox" checked> Has clinical postings</label><button class="primary" data-a="add">Add subject</button></div>'+
  '<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="link" data-a="tog">'+(state.subjects.some(function(s){return s.open!==false})?"Collapse all":"Expand all")+'</button><button class="link" data-a="reset">'+(pendReset?"Tap again to confirm":"Reset all counts")+'</button></div>';
  return h;
}
function vDay(){
  var n=Object.keys(draft).length;
  var h='<div class="panel"><div class="row"><label>Date <input type="date" id="dday" value="'+dayDate+'"></label><span style="flex:1"></span><button data-a="allp">Mark all present</button><button class="link" data-a="clr">Clear</button></div><div class="day">';
  h+=state.subjects.map(function(s){
    return '<div><div class="name">'+esc(s.name)+'</div>'+kindsFor(s).map(function(k){
      var v=draft[s.id+"|"+k[0]]||"x";
      function b(val,lbl,cl){return '<button class="'+cl+'" data-a="dv" data-sid="'+s.id+'" data-k="'+k[0]+'" data-v="'+val+'" aria-pressed="'+(v===val)+'">'+lbl+'</button>'}
      return '<div class="dr"><span>'+k[1]+'</span><div class="seg">'+b("p","Present","sp")+b("a","Absent","sa")+b("x","Skip","")+'</div></div>';
    }).join("")+'</div>';
  }).join("")+'</div><button class="primary" data-a="save"'+(n?'':' disabled')+' style="width:100%">'+(n?"Save "+n+(n===1?" entry":" entries"):"Choose Present or Absent to save")+'</button></div>';
  return h;
}
function vHist(){
  if(!state.log.length)return '<div class="panel empty">No entries yet. Marks you save from now on appear here by date.</div>';
  var groups={},order=[];
  state.log.slice().reverse().forEach(function(e){if(!groups[e.date]){groups[e.date]=[];order.push(e.date)}groups[e.date].push(e)});
  order.sort().reverse();
  return '<div class="panel">'+order.map(function(d){
    return '<div class="dh">'+fdate(d)+'</div>'+groups[d].map(function(e){
      var s=sub(e.sid);
      return '<div class="lr"><span>'+esc(s?s.name:"Removed subject")+', '+kname(e.k)+' <b style="color:'+colr(e.p)+'">'+(e.p?"Present":"Absent")+'</b></span><button class="link" data-a="rm" data-id="'+e.id+'">Remove</button></div>';
    }).join("");
  }).join("")+'</div>';
}
function commit(){save();render()}
function toast(m){var t=document.getElementById("toast");document.getElementById("tmsg").textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},4500)}
function undo(){if(history.length){state=JSON.parse(history.pop());commit();document.getElementById("toast").classList.remove("on")}}
document.addEventListener("change",function(e){if(e.target.id==="dday")dayDate=e.target.value||today()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="newName")act("add",e.target)});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.a)act(b.dataset.a,b)});
function act(a,b){
  var s=sub(b.dataset.sid),k=b.dataset.k;
  if(a==="v"){view=b.dataset.v;render();return}
  if(a==="undo"){undo();return}
  if((a==="p"||a==="a")&&s){snap();record(s,k,a==="p",today());commit();toast((a==="p"?"Present":"Absent")+" saved: "+s.name+", "+kname(k));return}
  if(a==="o"&&s){s.open=s.open===false;save();render();return}
  if(a==="c"&&s){snap();s.clin=!s.clin;commit();return}
  if(a==="d"&&s){
    if(pendDel!==s.id){pendDel=s.id;render();setTimeout(function(){if(pendDel===s.id){pendDel="";render()}},3000);return}
    snap();state.subjects=state.subjects.filter(function(x){return x.id!==s.id});state.log=state.log.filter(function(e){return e.sid!==s.id});pendDel="";commit();return}
  if(a==="add"){
    var n=document.getElementById("newName"),name=n.value.trim();
    if(!name){n.focus();return}
    snap();state.subjects.push(mk(name,document.getElementById("newClin").checked));commit();toast(name+" added");return}
  if(a==="tog"){var any=state.subjects.some(function(x){return x.open!==false});state.subjects.forEach(function(x){x.open=!any});save();render();return}
  if(a==="reset"){
    if(!state.subjects.length)return;
    if(!pendReset){pendReset=true;render();setTimeout(function(){if(pendReset){pendReset=false;render()}},3000);return}
    pendReset=false;snap();state.subjects.forEach(function(x){KINDS.forEach(function(q){x.d[q[0]]={a:0,t:0}})});state.log=[];commit();toast("All counts cleared");return}
  if(a==="dv"){var key=b.dataset.sid+"|"+k;if(b.dataset.v==="x")delete draft[key];else draft[key]=b.dataset.v;render();return}
  if(a==="allp"){state.subjects.forEach(function(x){kindsFor(x).forEach(function(q){draft[x.id+"|"+q[0]]="p"})});render();return}
  if(a==="clr"){draft={};render();return}
  if(a==="save"){
    var cnt=0;snap();
    state.subjects.forEach(function(x){kindsFor(x).forEach(function(q){var v=draft[x.id+"|"+q[0]];if(v){record(x,q[0],v==="p",dayDate);cnt++}})});
    draft={};commit();toast("Saved "+cnt+(cnt===1?" entry":" entries")+" for "+fdate(dayDate));return}
  if(a==="rm"){
    var e=state.log.filter(function(x){return x.id===b.dataset.id})[0];if(!e)return;
    snap();var t=sub(e.sid);if(t){var c=t.d[e.k];c.t=Math.max(0,c.t-1);if(e.p)c.a=Math.max(0,c.a-1)}
    state.log=state.log.filter(function(x){return x.id!==e.id});commit();toast("Entry removed")}
}
render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
